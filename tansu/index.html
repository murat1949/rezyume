<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E6DD;font-family:"Segoe UI",Arial,sans-serif;color:#17324F;overflow:hidden}
#wrap{position:absolute;left:50%;top:50%;width:1280px;height:760px;transform-origin:center center}
#sheet{position:absolute;inset:0 0 70px 0;background-color:#FBFAF6;border:2px solid #17324F;border-radius:6px;
background-image:linear-gradient(#E3EBF4 1px,transparent 1px),linear-gradient(90deg,#E3EBF4 1px,transparent 1px);background-size:24px 24px;overflow:hidden}
#sheet:before{content:"";position:absolute;inset:10px;border:1px solid #9FB3C8;pointer-events:none}
#left{position:absolute;left:44px;top:36px;width:510px;bottom:40px}
.kick{font-size:13px;letter-spacing:2px;font-weight:800;color:#E8642C;text-transform:uppercase}
.lead{font-size:27px;font-weight:800;line-height:1.22;margin-top:12px;color:#17324F}
.bd p{font-size:17.5px;line-height:1.5;color:#33465C;margin:11px 0 0}
.bd b{color:#17324F}
.bd .note{color:#7a8796;font-size:14.5px}
.quote{margin-top:16px;border-left:6px solid #E8642C;background:#FFF3EC;padding:14px 18px;font-size:18px;line-height:1.4;font-weight:600;color:#17324F}
.quote small{display:block;margin-top:8px;font-size:13px;font-weight:600;color:#7a8796}
#right{position:absolute;left:560px;top:16px;width:700px;height:618px}
#right svg{width:100%;height:100%}
#stamp{position:absolute;right:10px;bottom:10px;z-index:5;border:1px solid #17324F;background:#FBFAF6;font-size:11px;display:grid;grid-template-columns:86px 250px 96px;}
#stamp div{border:0.5px solid #9FB3C8;padding:3px 7px;white-space:nowrap}
#stamp .h{font-weight:800}
.ctl{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:space-between}
.b{border:2px solid #17324F;background:#FBFAF6;color:#17324F;font-size:17px;font-weight:700;padding:10px 22px;border-radius:8px;cursor:pointer}
.b.go{background:#E8642C;border-color:#E8642C;color:#fff}
#dots{display:flex;gap:6px;align-items:center}
#dots i{width:10px;height:10px;border-radius:50%;background:#C9D3DE;display:block;cursor:pointer}
#dots i.on{background:#E8642C}#dots i.done{background:#7FA3C6}
#dots span{font-size:12px;color:#7a8796;margin:0 6px 0 10px;font-weight:700}
.vb{display:inline-block;border:2px solid #17324F;border-radius:10px;padding:9px 14px;margin:7px 6px 0 0;font-size:15.5px;font-weight:700;cursor:pointer;background:#fff;user-select:none}
.vb.on{background:#D64541;border-color:#D64541;color:#fff}
.res{margin-top:14px;font-size:17.5px;line-height:1.45;color:#33465C}
.res .t{font-size:30px;font-weight:900;color:#17324F}
.wa{display:inline-block;background:#25D366;color:#fff;text-decoration:none;font-weight:800;padding:12px 20px;border-radius:10px;font-size:17px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ani{animation:pop .5s both}
