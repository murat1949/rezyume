:30px;bottom:14px;font-size:12px;color:#7a8796}\n<\/style><\/head><body>\n<div id=\"wrap\"><div id=\"sheet\">\n <div class=\"hd\"><div class=\"k\">Демонстрационный экран · Spark · условные данные<\/div><h1>Сутки заказа<\/h1><p>Пример маршрута с целевым сроком 24 часа. Один заказ — один круг.<\/p><\/div>\n <div id=\"sel\" style=\"position:absolute;left:36px;top:104px;width:620px;font-size:14px;color:#33465C\"><\/div>\n <svg id=\"dial\" viewBox=\"0 0 640 520\" style=\"top:126px\"><\/svg>\n <div id=\"ramp\"><svg id=\"rs\" viewBox=\"0 0 580 330\" width=\"580\" height=\"330\"><\/svg><\/div>\n <div id=\"recs\"><div style=\"font-size:13px;font-weight:800;color:#5c6b7c;margin:0 0 6px 4px\">ПРИМЕР РЕКОМЕНДАЦИЙ МОДЕЛИ ОПТИМИЗАЦИИ · условные данные<\/div><\/div>\n <div id=\"sum\"><span id=\"s1\">Принято мер: 0<\/span><span id=\"s2\">Затраты: 0 ₸ в день<\/span><\/div>\n <div id=\"stamp\">Разработал: Накупов М., инженер-системотехник · цифры условные, для примера<\/div>\n<\/div><\/div>\n<script>\nconst NS='http://www.w3.org/2000/svg';\nfunction el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}\nfunction tx(p,x,y,s,a){const e=el('text',Object.assign({x,y,'text-anchor':'middle','dominant-baseline':'central','font-family':'Segoe UI,Arial',fill:'#17324F','font-size':14},a||{}),p);e.textContent=s;return e}\nconst fmt=h=>(Math.round(h*10)/10).toString().replace('.',',');\n/* этапы одного заказа */\nconst COL={s:'#2A9D8F',w:'#D64541',t:'#5B5BD6',c:'#E8642C'};\nconst BASE=[['Заказ в системе',0.5,'s'],['Подбор',2,'s'],['Упаковка',1,'s'],['В зону отгрузки',0.5,'s'],['Ждёт рейса на рампе',5.5,'w'],['Погрузка',1,'t'],['Магистраль',10,'t'],['Сортировка в городе',3,'t'],['Курьер',5,'c']];\nconst REC=[\n {n:'Сортировать по городам прямо на складе-отправителе',d:'−2 ч',c:10000},\n {n:'Курьеры: плотнее маршруты, +1 курьер на полдня',d:'−1 ч',c:6000},\n {n:'Быстрее погрузка и планирование рейса',d:'−1,5 ч',c:6500},\n {n:'Дополнительный рейс в 17:00',d:'−4 ч',c:40000}];\nconst ON=[0,0,0,0];\n/* заказы дня */\nlet seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};\nconst ORD=[];for(let k=0;k<30;k++){const ready=8.6+k*0.4+rnd()*0.25;const pick=1.5+rnd(),pack=0.7+rnd()*0.5,mag=9+rnd()*2,cour=4+rnd()*2;\n ORD.push({no:1001+k*37,ready,pick,pack,mag,cour})}\nlet SEL=-1;\nfunction nextTruck(t,extra){const L=[13,21].concat(extra?[17]:[]).sort((a,b)=>a-b);for(const x of L)if(x>=t)return x;return 24+13}\nfunction orderDur(o,on){const zone=0.5;const atRamp=o.ready+zone;let wait=nextTruck(atRamp,on[3])-atRamp;if(on[2])wait=Math.max(0,wait-1);\n return [0.5,o.pick,o.pack,zone,wait,on[2]?0.5:1,o.mag,on[0]?1:3,on[1]?o.cour-1:o.cour]}\nfunction orderStart(o){return o.ready-o.pack-o.pick-0.5}\n\nfunction target(){if(SEL>=0)return orderDur(ORD[SEL],ON);const D=BASE.map(b=>b[1]);\n if(ON[0])D[7]=1; if(ON[1])D[8]=4;\n if(ON[3])D[4]=1.5; else if(ON[2])D[4]=4.5;\n if(ON[2])D[5]=0.5; return D}\nlet CUR=BASE.map(b=>b[1]);\n/* циферблат */\nconst dial=document.getElementById('dial');const CX=300,CY=212,R1=160,R2=114,W=28;\nfunction pt(r,h){const a=(h/24)*2*Math.PI-Math.PI/2;return[CX+r*Math.cos(a),CY+r*Math.sin(a)]}\nfunction arc(r,h0,h1){if(h1-h0>=23.999)h1=h0+23.999;const[x0,y0]=pt(r,h0),[x1,y1]=pt(r,h1);const lg=(h1-h0)>12?1:0;return`M${x0} ${y0} A${r} ${r} 0 ${lg} 1 ${x1} ${y1}`}\nfunction drawDial(D){dial.innerHTML='';\n el('circle',{cx:CX,cy:CY,r:R1,fill:'none',stroke:'#E6ECF2','stroke-width':W},dial);\n for(let h=0;h<24;h++){const[a,b]=pt(R1+W/2+4,h),[c,d]=pt(R1+W/2+(h%3?10:16),h);el('line',{x1:a,y1:b,x2:c,y2:d,stroke:'#17324F','stroke-width':h%3?1:2},dial);\n  if(h%3==0){const[x,y]=pt(R1+W/2+32,h);tx(dial,x,y,h+' ч',{'font-size':13,'font-weight':700,fill:'#5c6b7c'})}}\n const tot=D.reduce((a,b)=>a+b,0);\n if(tot>24)el('circle',{cx:CX,cy:CY,r:R2,fill:'none',stroke:'#FBE3E0','stroke-width':W},dial);\n let h=0;\n D.forEach((d,i)=>{const col=COL[BASE[i][2]];const s=h,e=h+d;h=e;\n  const gap=d>0.4?0.08:0.02;\n  if(s<24){const e1=Math.min(e,24);el('path',{d:arc(R1,s+gap,e1-gap),fill:'none',stroke:col,'stroke-width':W,'stroke-linecap':'butt'},dial)}\n  if(e>24){const s2=Math.max(s,24)-24,e2=e-24;el('path',{d:arc(R2,s2+gap,e2-gap),fill:'none',stroke:col,'stroke-width':W,opacity:.55},dial);\n   el('path',{d:arc(R2,s2+gap,e2-gap),fill:'none',stroke:'#D64541','stroke-width':2,'stroke-dasharray':'4 4',transform:'',opacity:.9},dial)}\n  if(d>=1.4){const mid=(s+e)/2;const r=(mid<24?R1:R2);const[x,y]=pt(r,mid%24);\n   const t=tx(dial,x,y,fmt(d),{'font-size':13,'font-weight':800,fill:'#fff'});}\n });\n /* подписи этапов — легенда снаружи справа */\n const ok=tot<=24.001;\n el('circle',{cx:CX,cy:CY,r:R2-W/2-6,fill:'#fff',stroke:ok?'#2E9B6A':'#D64541','stroke-width':3},dial);\n tx(dial,CX,CY-32,ok?'укладываемся':'не укладываемся',{'font-size':15,'font-weight':800,fill:ok?'#2E9B6A':'#D64541'});\n tx(dial,CX,CY+6,fmt(tot)+' ч',{'font-size':44,'font-weight':900,fill:ok?'#2E9B6A':'#D64541'});\n tx(dial,CX,CY+38,'от заказа до покупателя',{'font-size':12,fill:'#5c6b7c'});\n if(!ok){const[x,y]=pt(R2-62,((tot-24)/2));tx(dial,CX,CY+56,'+'+fmt(tot-24)+' ч сверх цели',{'font-size':12,'font-weight':800,fill:'#D64541'})}\n else{const[x0,y0]=pt(R1,0);el('circle',{cx:x0,cy:y0,r:9,fill:'#2E9B6A',stroke:'#fff','stroke-width':3},dial)}\n /* легенда */\n const L=[['s','Склад'],['w','Ожидание рейса'],['t','Транспорт'],['c','Курьер']];\n L.forEach(([k,n],i)=>{el('rect',{x:510,y:40+i*26,width:14,height:14,rx:4,fill:COL[k]},dial);tx(dial,530,47+i*26,n,{'text-anchor':'start','font-size':12.5,'font-weight':600})});\n drawMosaic();\n}\nfunction drawMosaic(){\n tx(dial,20,428,'Заказы дня — нажмите на любой (показаны 30 из ~1 400)',{'text-anchor':'start','font-size':13,'font-weight':700,fill:'#5c6b7c'});\n const t0=el('g',{style:'cursor:pointer'},dial);t0.onclick=()=>{SEL=-1;info();tween()};\n el('rect',{x:20,y:448,width:96,height:56,rx:10,fill:SEL<0?'#17324F':'#fff',stroke:'#17324F'},t0);tx(t0,68,467,'Типовой',{'font-size':13,'font-weight':800,fill:SEL<0?'#fff':'#17324F'});tx(t0,68,486,'заказ',{'font-size':13,'font-weight':800,fill:SEL<0?'#fff':'#17324F'});\n ORD.forEach((o,k)=>{const D=orderDur(o,ON);const tot=D.reduce((a,b)=>a+b,0);const ok=tot<=24.001;\n  const x=140+(k%15)*33,y=462+Math.floor(k/15)*30;const g=el('g',{style:'cursor:pointer'},dial);g.onclick=()=>{SEL=k;info();tween()};\n  el('circle',{cx:x,cy:y,r:12,fill:'#fff',stroke:SEL==k?'#E8642C':'#E6ECF2','stroke-width':SEL==k?4:5},g);\n  const fr=Math.min(tot,24)/24;const C=2*Math.PI*12;\n  el('circle',{cx:x,cy:y,r:12,fill:'none',stroke:ok?'#2E9B6A':'#D64541','stroke-width':4,'stroke-dasharray':`${C*fr} ${C}`,transform:`rotate(-90 ${x} ${y})`},g);\n  if(!ok)el('circle',{cx:x,cy:y,r:6,fill:'#D64541',opacity:.8},g)});\n}\nfunction info(){const e=document.getElementById('sel');if(SEL<0){e.innerHTML='Сейчас показан: <b>типовой заказ дня<\/b> — средний путь всех заказов';return}\n const o=ORD[SEL];const D=orderDur(o,ON);const tot=D.reduce((a,b)=>a+b,0);const atR=o.ready+0.5;const tr=nextTruck(atR,ON[3]);\n e.innerHTML=`Сейчас показан: <b>заказ №${o.no}<\/b> · поступил ${hh(orderStart(o))} · упакован ${hh(o.ready)} · уехал рейсом ${tr>24?'<b style=\"color:#D64541\">завтра в 13:00<\/b>':hh(tr).slice(0,5)} · ждал на рампе <b>${fmt(D[4])} ч<\/b>`}\nfunction tween(){const T=target();const from=CUR.slice();const t0=performance.now();\n (function f(t){const k=Math.min(1,(t-t0)/900);const e=1-Math.pow(1-k,3);CUR=from.map((v,i)=>v+(T[i]-v)*e);drawDial(CUR);if(k<1)requestAnimationFrame(f)})(t0)}\n/* рекомендации */\nconst recs=document.getElementById('recs');\nREC.forEach((r,i)=>{const d=document.createElement('div');d.className='rc';d.innerHTML=`<span class=\"bx\">✓<\/span><span>${r.n}<\/span><span class=\"d\">${r.d}<\/span><span class=\"c\">${r.c.toLocaleString('ru-RU')} ₸<\/span>`;\n d.onclick=()=>{ON[i]^=1;d.classList.toggle('on',!!ON[i]);if(i==3)ramp.extra=!!ON[3];tween();sums();info()};recs.appendChild(d)});\nfunction sums(){const n=ON.reduce((a,b)=>a+b,0);const c=REC.reduce((a,r,i)=>a+(ON[i]?r.c:0),0);\n document.getElementById('s1').textContent='Принято мер: '+n;document.getElementById('s2').textContent='Затраты: '+c.toLocaleString('ru-RU')+' ₸ в день'}\n/* рампа */\nconst rs=document.getElementById('rs');\nconst ramp={extra:false};\nconst X0=40,X1=550,H0=8,H1=24;const hx=h=>X0+(h-H0)/(H1-H0)*(X1-X0);\nconst TRK=[13,21],TRX=17;\nlet orders=[],now=8,lastSpawn=8;\nfunction hh(h){const H=Math.floor(h),M=Math.floor((h-H)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')}\nfunction drawRamp(){rs.innerHTML='';\n tx(rs,24,22,'Рампа отгрузки · сегодня',{'text-anchor':'start','font-size':17,'font-weight':800});\n el('line',{x1:X0,y1:250,x2:X1,y2:250,stroke:'#17324F','stroke-width':2},rs);\n for(let h=8;h<=24;h+=2){el('line',{x1:hx(h),y1:246,x2:hx(h),y2:254,stroke:'#17324F'},rs);tx(rs,hx(h),268,hh(h).slice(0,5),{'font-size':11.5,fill:'#5c6b7c'})}\n const trucks=TRK.concat(ramp.extra?[TRX]:[]);\n trucks.forEach(t=>{const x=hx(t);const gone=now>=t;\n  el('line',{x1:x,y1:98,x2:x,y2:250,stroke:gone?'#9FB3C8':'#5B5BD6','stroke-width':2,'stroke-dasharray':'5 4'},rs);\n  const g=el('g',{transform:`translate(${x-22},${gone?62:72})`,opacity:gone?.35:1},rs);\n  el('rect',{x:0,y:0,width:30,height:20,rx:3,fill:t==TRX?'#2E9B6A':'#5B5BD6'},g);el('rect',{x:30,y:6,width:14,height:14,rx:2,fill:t==TRX?'#2E9B6A':'#5B5BD6'},g);\n  el('circle',{cx:9,cy:22,r:4,fill:'#17324F'},g);el('circle',{cx:36,cy:22,r:4,fill:'#17324F'},g);\n  tx(rs,x,56,'рейс '+hh(t).slice(0,5),{'font-size':11.5,'font-weight':700,fill:t==TRX?'#2E9B6A':'#5B5BD6'})});\n /* заказы в очереди */\n const q=orders.filter(o=>!o.left);\n q.forEach((o,i)=>{const wait=now-o.t;const col=wait>4?'#D64541':wait>2?'#E8A23C':'#2A9D8F';\n  const col_i=i%9,row=Math.floor(i/9);el('circle',{cx:hx(now)-10-col_i*11,cy:228-row*11,r:4.6,fill:col},rs)});\n el('line',{x1:hx(now),y1:60,x2:hx(now),y2:256,stroke:'#E8642C','stroke-width':2.5},rs);\n tx(rs,hx(now),278+12,'сейчас '+hh(now),{'font-size':12,'font-weight':800,fill:'#E8642C'});\n const red=q.filter(o=>now-o.t>4).length;const nxt=trucks.filter(t=>t>now).sort((a,b)=>a-b)[0];\n tx(rs,24,306,`Ждут на рампе: ${q.length}`,{'text-anchor':'start','font-size':15,'font-weight':800});\n tx(rs,200,306,`дольше 4 ч: ${red}`,{'text-anchor':'start','font-size':15,'font-weight':800,fill:red?'#D64541':'#2E9B6A'});\n tx(rs,400,306,nxt?`до рейса ${hh(nxt-now).slice(0,5)}`:'рейсов больше нет',{'text-anchor':'start','font-size':15,'font-weight':700,fill:'#5B5BD6'});\n}\nfunction tick(){now+=0.025;if(now>24){now=8;orders=[];lastSpawn=8}\n if(now<20.5&&now-lastSpawn>0.22){orders.push({t:now,left:false});lastSpawn=now}\n const trucks=TRK.concat(ramp.extra?[TRX]:[]);\n trucks.forEach(t=>{if(now>=t&&now-0.025<t)orders.forEach(o=>{if(!o.left)o.left=true})});\n drawRamp()}\nsetInterval(tick,40);\ndrawDial(CUR);sums();info();\nfunction fit(){const s=Math.min(innerWidth/1300,innerHeight/780);document.getElementById('wrap').style.transform=`translate(-50%,-50%) scale(${s})`}\naddEventListener('resize',fit);fit();\n<\/script><\/body><\/html>\n";

const F=[];
const TXL={"Знакомство": ["Отклик · Spark", "Айдар Акылбекович, здравствуйте!", ["Меня зовут Мурат Накупов, я инженер-системотехник. Я увидел, что Spark ищет аналитика бизнес-процессов, и прочитал ваши выступления — на LogForum Asia и в отраслевой прессе.", "Одна ваша фраза меня зацепила. Я решил ответить на неё не резюме, а наглядным примером: где такой день может теряться, как это проверить по данным и как его вернуть. Это займёт около пяти минут."]], "Цена одного дня": ["Почему лишний день имеет значение", "Сколько стоит один день между складом и транспортом", ["Склад отработал вовремя. Транспорт отработал вовремя. А между ними заказ пролежал лишние сутки — и покупатель передумал.", "По вашей оценке рынка, это <b>15% отказов в e-commerce</b> и <b>до 40% падения продаж</b> в рознице по отдельной категории. И каждый отказ — это ещё и обратный путь: принять товар, проверить, вернуть на полку.", "При объёмах в сотни тысяч заказов в год даже небольшая доля отказов — это тысячи возвратов. Поэтому я начал с вопроса: <b>где такой лишний день может рождаться и как это проверить?</b>"]], "Путь заказа": ["Путь заказа · упрощённая схема в стиле BPMN", "Сначала — путь одного заказа", ["Я нарисовал его по «дорожкам»: склад и транспорт — внутри Spark, а Kaspi и покупатель — внешние участники. Пунктиром показан обмен с ними: заказ приходит, посылка уходит к покупателю.", "Внутри каждой дорожки всё понятно и, судя по вашим показателям, хорошо налажено: точность сборки 99,9%, срочные заказы собираются за час.", "Самое интересное начинается там, где заказ <b>переходит из одной дорожки в другую</b>.", "<span style=\"color:#7a8796;font-size:15px\">Схема составлена по открытым материалам Spark. В реальности она, конечно, подробнее.</span>"]], "Развилка": ["Одна возможная причина", "Развилка: успели к рейсу?", ["Заказ собран и упакован. Если успели к рейсу — он уезжает. Если нет — встаёт на полку и ждёт следующую машину. Иногда до вечера, иногда до завтра.", "Склад своё сделал вовремя, транспорт — тоже, а заказ всё равно ждёт. В примере я показываю одну возможную причину задержки — ожидание на стыке. <b>Возникает ли она у Spark и насколько часто, можно проверить по данным.</b>", "Вы говорили о том, что интеграция склада и транспорта <b>«консолидирует ответственность»</b>. Чтобы понять, где это даст больше всего, развилку полезно увидеть в цифрах: сколько заказов не успевают к рейсу, сколько часов ждут и почему."]], "Сетевой график": ["Сетевой график · метод критического пути", "Сколько это занимает времени", ["BPMN показывает, кто и что делает. Но не отвечает на вопрос, <b>сколько это занимает времени и где его можно сократить</b>. Для этого есть сетевой график — классический инструмент инженерного планирования.", "Кружки — <b>события</b>: «заказ упакован», «машина на рампе», «вручён». Стрелки — <b>работы</b> между ними, с длительностью. Часть работ идёт параллельно: пока склад собирает заказ, логисты уже планируют рейс.", "В каждом кружке — номер события, самый ранний и самый поздний срок его наступления и резерв: сколько часов событие может «подождать», не задерживая общий срок.", "<span style=\"color:#7a8796;font-size:15px\">Длительности условные, для примера.</span>"]], "Критический путь": ["Критический путь", "Красная цепочка задаёт срок", ["Самая длинная цепочка работ называется <b>критическим путём</b>. Именно она задаёт общий срок: в примере — <b>28,5 часа</b> от заказа до покупателя. Больше суток.", "Посмотрите на верхнюю ветку — подбор и упаковку. У неё <b>резерв 5,5 часа</b>: в примере заказ готов, а машины ещё нет. Ожидание на стыке, измеренное в часах.", "Отсюда правило метода: <b>чтобы сократить общий срок, ускорять нужно работы на критическом пути</b>. Ускорение других работ срок не сократит, хотя может повысить надёжность или снизить расходы. И после каждого ускорения критический путь нужно пересчитывать: он может сместиться."]], "Варианты": ["Условные варианты решений и их стоимости", "Проверим правило на трёх решениях", ["<b>А</b> — второй рейс в день: заказы меньше ждут машину. <b>Б</b> — сортировка по городам прямо на складе: в городе не нужно сортировать заново. <b>В</b> — ускорить сборку вдвое: самое очевидное решение.", "Нажимайте по одному и вместе — график пересчитается сам."]], "Самолёт": ["Пример из жизни", "Как успеть на самолёт и не переплатить", ["До вылета <b>4 часа</b>, а дорога занимает <b>5</b>. Не успеваем на час.", "Каждый участок пути можно ускорить — но за деньги, и цены разные: такси до трассы — полчаса за 2 000 ₸, платная дорога — полчаса за 1 000 ₸, быстрая регистрация — час за 10 000 ₸.", "Разумный человек начнёт с дешёвого: платная дорога и такси — вместе <b>час за 3 000 ₸</b>. Быструю регистрацию за 10 000 ₸ покупать не нужно.", "<b>Успеть к сроку и потратить как можно меньше — это и есть оптимизация.</b>"]], "Кого ждут": ["Пример из жизни · продолжение", "Ускорять нужно того, кого ждут", ["Теперь вы едете не один. Вы — сразу в аэропорт, а супруга заезжает за документами. Встречаетесь у входа.", "Вы приезжаете на час раньше. Если взять такси — вы просто дольше простоите у входа. <b>Деньги потрачены, а улетите не раньше.</b>", "Ускорять имеет смысл только того, кого ждут. В сетевом графике такая цепочка и называется <b>критическим путём</b>."]], "Склад — то же самое": ["От примера к складу", "У склада — то же самое, только сложнее", ["Участков не три, а десять. Часть идёт параллельно: пока собирают заказ, логисты планируют рейс. У каждого участка — своя цена ускорения.", "И стоит ускорить одних, как ждать начинают других. Сочетаний — тысячи. <b>В уме это уже не посчитать.</b>", "Для таких задач есть точный математический метод — <b>линейное программирование</b>. Его постановка — на следующем листе."]], "Математика": ["Математическая модель · линейное программирование", "Та же задача — строго, для специалиста", ["То, что мы разобрали на примере самолёта, в математике записывается так: <b>переменные</b> — что мы выбираем, <b>целевая функция</b> — чего хотим, <b>ограничения</b> — что нельзя нарушить.", "Задача решается стандартным симплекс-методом за доли секунды, а на реальных данных Spark просто пересчитывается.", "Что даёт этот расчёт руководителю — на следующем листе."]], "Сколько стоит ускорить": ["Что даёт расчёт", "Каждая мера стоит денег. Вопрос — какие из них окупаются временем", ["Чтобы заказ шёл быстрее, нужны меры: второй рейс, ещё один курьер, сортировка прямо на складе. <b>Каждая мера — это дополнительные затраты</b> в день.", "<b>Одни меры сокращают общий срок</b> — за свои деньги они дают выигрыш во времени. <b>Другие стоят денег, а срок не меняют</b>: они ускоряют то, что и так успевает. Это затраты без выигрыша.", "Модель отбирает только первые — и в самом дешёвом порядке. Справа — что она предлагает для каждого срока. Руководитель выбирает срок, а модель говорит, <b>что для этого сделать и во что это обойдётся</b>.", "<span style=\"color:#7a8796;font-size:15px\">Цифры условные, для примера.</span>"]], "Каким будет инструмент": ["Как это может выглядеть", "Руководитель видит одну картинку — часы", ["Вся эта математика не должна быть видна руководителю. Каждый заказ проходит по циферблату свой круг: склад, ожидание на рампе, машина, курьер. <b>Здесь — пример маршрута с целевым сроком 24 часа</b>; для других маршрутов цель своя.", "Уложился в целевой срок — круг замкнулся, он зелёный. Не уложился — хвост вылез на второй, внутренний круг, и отклонение от цели видно сразу.", "Каждый круг может рассчитываться по <b>сканам склада и данным о рейсах</b>. Рядом — рекомендации модели: что изменить, на сколько часов это сократит путь и сколько стоит.", "<b>На следующем листе — демонстрационный экран</b> на условных данных. Нажимайте на кружки заказов и на рекомендации."]], "Предложение": ["Предложение", "Предлагаю посчитать ваш настоящий день", ["Всё, что вы видели, построено на условных цифрах. Следующий шаг — проверить гипотезы на ваших данных.", "Предлагаю <b>бесплатный первичный разбор одного маршрута или группы заказов</b>. За 2–3 рабочих дня после получения данных я построю схему процесса «как есть», сетевой график с реальными временами, найду критический путь и подготовлю <b>2–3 варианта решений с оценкой</b>: что может дать каждый и во что обойдётся.", "Результат — выводы и предложения для обсуждения с вашей операционной и IT-командой: что проверить дальше и что имеет смысл автоматизировать в первую очередь.", "Объём, сроки и стоимость дальнейшей работы обсудим отдельно — по итогам разбора."]], "Обо мне": ["Обо мне", "«Точное понимание бизнес-процессов» — это моя работа", ["Так вы сказали на LogForum Asia о роботизации. По образованию я <b>инженер-системотехник, выпускник МАИ</b>, окончил аспирантуру Института кибернетики. Помог привести в систему более 200 компаний.", "Самый значимый мой проект — проектный институт, где <b>более 2000 строительных объектов</b> встали из-за изменения цен: все сметы устарели. Я начал не с компьютеров, а с того, как проект проходит по институту, — и через полгода документация ушла строителям.", "Этот опыт научил меня главному: <b>автоматизация приносит пользу, только когда понятен сам процесс</b>. Сегодня я также разрабатываю инструменты автоматизации и контроля с применением нейросетей."]], "Встреча": ["Давайте встретимся", "30 минут — и выберем день для разбора", ["Если такой подход вам интересен, давайте встретимся на 30 минут. Вы расскажете, где сейчас болит сильнее всего, а я покажу, как проведу разбор и какой результат подготовлю.", "Напишите или позвоните мне."]]};
